[project]
name = "binit"
version = "0.1.0"
description = "A minimal github release binary installer and manager"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "click==8.3.1",
    "filetype==1.2.0",
    "ghapi==1.0.13",
    "httpx==0.28.1",
    "marshmallow==4.2.2",
    "rich==14.3.3",
    "ruamel-yaml==0.19.1",
]

[project.scripts]
binit = "binit.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest==9.0.2",
]
